<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MausBot Notch</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="notch-stage" class="notch-stage">
      <!-- Single U-shaped black Notch pouch (starts collapsed, expands downward on click or the shortcut) -->
      <div id="notch-pouch" class="notch-pouch" data-expanded="false" data-status="idle" data-typing="false">
        <!-- BOT IDENTITY BAR — visible in both collapsed and expanded states -->
        <!-- In collapsed: two wings beside the hardware notch, inside the menu bar, clickable to expand -->
        <!-- In expanded: sits at the top of the pouch as a non-interactive label -->
        <button id="collapsed-bar" class="collapsed-bar" type="button" title="Open MausBot Notch">
          <!-- The notch-width column between the wings stays empty: the hardware notch covers it -->
          <span class="collapsed-wing collapsed-wing-left">
            <span id="collapsed-mark" class="collapsed-mark"></span>
            <span id="collapsed-name" class="collapsed-name">MausBot</span>
            <span id="collapsed-preview" class="collapsed-preview" hidden></span>
            <span id="collapsed-others" class="collapsed-others"></span>
          </span>
          <span class="collapsed-notch-slot" aria-hidden="true"></span>
          <span class="collapsed-wing collapsed-wing-right">
            <span id="collapsed-unread" class="collapsed-unread" hidden></span>
            <span id="collapsed-dot" class="collapsed-dot" aria-hidden="true"></span>
            <span id="collapsed-clock" class="collapsed-clock"></span>
          </span>
        </button>

        <!-- EXPANDED POUCH CONTENT -->
        <div id="expanded-content" class="expanded-content">

          <!-- Middle: bot name + status caption -->
          <div id="bot-title-block" class="bot-title-block" title="Double-click to collapse">
            <span id="bot-name-label" class="bot-name-label">MausBot</span>
            <span id="bot-status-caption" class="bot-status-caption" hidden></span>
          </div>

          <!-- Shown while waiting for a bot's reply -->
          <div id="stop-area" class="stop-area" hidden>
            <span id="stop-elapsed" class="stop-elapsed"></span>
            <button id="stop-btn" class="chip" type="button" title="Stop waiting for this reply. The bot itself may still finish it.">Stop waiting</button>
          </div>

          <!-- Kai OS quick actions on what's on screen / what you're writing -->
          <div id="action-chips" class="action-chips">
            <button class="chip" type="button" data-task="summarize" title="Summarize what is showing on your screen">Summarize</button>
            <button class="chip" type="button" data-task="proofread" title="Proofread the text you're writing (or the main text on your screen)">Proofread</button>
            <button id="rewrite-chip" class="chip" type="button" title="Rewrite the text you selected">Rewrite ▾</button>
            <button id="calendar-chip" class="chip" type="button" title="Show your calendar for the day">Calendar</button>
            <button id="transcript-chip" class="chip chip-quiet" type="button" title="Show the conversation with this bot">Transcript</button>
            <button id="settings-chip" class="chip chip-quiet" type="button" aria-label="Settings" title="Settings">⚙</button>
          </div>
          <div id="rewrite-menu" class="action-chips rewrite-menu" hidden>
            <button class="chip" type="button" data-prompt="starter-concise">Make it concise</button>
            <button class="chip" type="button" data-prompt="starter-simple">Explain simply</button>
            <button class="chip" type="button" data-prompt="starter-bullets">Turn into bullets</button>
            <button class="chip" type="button" data-prompt="starter-spanish">Translate to Spanish</button>
            <div id="rewrite-mine" class="rewrite-mine"></div>
            <button id="rewrite-edit" class="chip chip-quiet" type="button" title="Add or change your own presets">Edit…</button>
            <button id="rewrite-back" class="chip chip-quiet" type="button" title="Back">✕</button>
          </div>

          <!-- Result card (Summary / Proofread / Rewrite), Kai's KaiResultCard -->
          <div id="result-view" class="result-view" hidden>
            <div class="result-header">
              <span id="result-title" class="result-title"></span>
              <span class="result-spacer"></span>
              <button id="result-copy" class="result-btn" type="button" title="Copy">Copy</button>
              <button id="result-close" class="result-btn result-close" type="button" title="Close (Esc)">✕</button>
            </div>
            <div id="result-body" class="result-body">
              <div id="result-text" class="result-text"></div>
              <div id="result-notes" class="result-notes"></div>
            </div>
            <div class="result-actions">
              <button id="result-replace" class="chip chip-primary" type="button" hidden>Replace</button>
              <div id="refine-chips" class="refine-chips"></div>
            </div>
            <div id="result-footer" class="result-footer"></div>
          </div>

          <!-- Conversation with the selected bot -->
          <div id="transcript-view" class="transcript-view" hidden>
            <div class="result-header">
              <span class="result-title">Transcript</span>
              <span class="result-spacer"></span>
              <button id="transcript-copy" class="result-btn" type="button" title="Copy the whole conversation">Copy all</button>
              <button id="transcript-close" class="result-btn result-close" type="button" title="Close (Esc)">✕</button>
            </div>
            <div id="transcript-list" class="transcript-list"></div>
          </div>

          <!-- One day of the Mac's calendars -->
          <div id="calendar-view" class="transcript-view" hidden>
            <div class="result-header">
              <button id="event-back" class="result-btn" type="button" title="Back to the day (Esc)" hidden>‹ Back</button>
              <button id="calendar-prev" class="result-btn" type="button" aria-label="Previous day" title="Previous day (←)">‹</button>
              <span id="calendar-date" class="result-title"></span>
              <button id="calendar-next" class="result-btn" type="button" aria-label="Next day" title="Next day (→)">›</button>
              <span class="result-spacer"></span>
              <button id="calendar-today" class="result-btn" type="button" title="Back to today">Today</button>
              <button id="calendar-close" class="result-btn result-close" type="button" title="Close (Esc)">✕</button>
            </div>
            <div id="calendar-list" class="transcript-list"></div>
            <div id="event-detail" class="event-detail" hidden></div>
            <button id="event-open-link" class="chip chip-primary event-open-link" type="button" hidden></button>
            <button id="calendar-privacy" class="chip calendar-privacy" type="button" hidden>Open System Settings</button>
          </div>

          <!-- Bottom row: < (prev bot) | tap-to-type | > (next bot) -->
          <div class="bottom-nav-row">
            <button id="prev-bot-btn" class="nav-chevron-btn" type="button" aria-label="Previous bot" title="Previous bot (←)">
              <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.25 3.5 5.75 8l4.5 4.5" />
              </svg>
            </button>

            <!-- Center: tap-to-type target OR left-aligned inline text input -->
            <div class="center-wave-slot">
              <button
                id="tap-to-type-btn"
                class="tap-to-type-btn"
                type="button"
                title="Tap to type a message"
              >
                <div id="idle-dots" class="idle-dots">
                  <span></span><span></span><span></span>
                </div>
              </button>

              <form id="type-form" class="type-form" autocomplete="off" hidden>
                <input
                  id="type-input"
                  class="type-input"
                  type="text"
                  placeholder="Message MausBot…"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="off"
                  spellcheck="false"
                />
              </form>
            </div>

            <button id="next-bot-btn" class="nav-chevron-btn" type="button" aria-label="Next bot" title="Next bot (→)">
              <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5.75 3.5 10.25 8l-4.5 4.5" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
