<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MausBot Notch</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="notch-stage" class="notch-stage">
      <!-- Single U-shaped black Notch pouch (starts collapsed, expands downward on click or ⌥Space) -->
      <div id="notch-pouch" class="notch-pouch" data-expanded="false" data-status="idle" data-typing="false" data-view="default" data-unread="false">
        <!-- Top-flush concave notch ears at y = 0 -->
        <svg class="notch-ear notch-ear-left" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M18 0H0C9.941 0 18 8.059 18 18V0Z" />
        </svg>
        <svg class="notch-ear notch-ear-right" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M0 0H18C8.059 0 0 8.059 0 18V0Z" />
        </svg>

        <!-- BOT IDENTITY BAR — visible in both collapsed and expanded states -->
        <!-- In collapsed: fills the chin below the notch, clickable to expand -->
        <!-- In expanded: sits at the top of the pouch as a non-interactive label -->
        <button id="collapsed-bar" class="collapsed-bar" type="button" title="Expand MausBot Notch (⌥Space)">
          <span id="collapsed-mark" class="collapsed-mark"></span>
          <span id="collapsed-name" class="collapsed-name">MausBot</span>
          <span id="collapsed-dot" class="collapsed-dot" aria-hidden="true"></span>
          <span id="collapsed-unread-badge" class="collapsed-unread-badge" hidden></span>
          <span id="collapsed-preview" class="collapsed-preview" hidden></span>
        </button>

        <!-- EXPANDED POUCH CONTENT -->
        <div id="expanded-content" class="expanded-content">

          <!-- Middle: bot name + status caption -->
          <div id="bot-title-block" class="bot-title-block" title="Double-click to collapse">
            <span id="bot-name-label" class="bot-name-label">MausBot</span>
            <span id="bot-status-caption" class="bot-status-caption" hidden></span>
          </div>

          <!-- P0 #1: View switcher (default | transcript) -->
          <div id="view-switcher" class="view-switcher" hidden>
            <button id="view-default" class="chip chip-quiet" type="button">Notch</button>
            <button id="view-transcript" class="chip chip-quiet" type="button">Transcript</button>
          </div>

          <!-- Default view: actions + status + input -->
          <div id="view-default-panel" class="view-panel">
            <!-- Kai OS quick actions on what's on screen / what you're writing -->
            <div id="action-chips" class="action-chips">
              <button class="chip" type="button" data-task="summarize" title="Summarize what is showing on your screen">Summarize</button>
              <button class="chip" type="button" data-task="proofread" title="Proofread the text you're writing (or the main text on your screen)">Proofread</button>
              <button id="rewrite-chip" class="chip" type="button" title="Rewrite the text you selected">Rewrite ▾</button>
            </div>
            <div id="rewrite-menu" class="action-chips" hidden>
              <button class="chip" type="button" data-prompt="starter-concise">Make it concise</button>
              <button class="chip" type="button" data-prompt="starter-simple">Explain simply</button>
              <button class="chip" type="button" data-prompt="starter-bullets">Turn into bullets</button>
              <button class="chip" type="button" data-prompt="starter-spanish">Translate to Spanish</button>
              <button id="rewrite-back" class="chip chip-quiet" type="button" title="Back">✕</button>
            </div>

            <!-- Result card (Summary / Proofread / Rewrite), Kai's KaiResultCard -->
            <div id="result-view" class="result-view" hidden>
              <div class="result-header">
                <span id="result-title" class="result-title"></span>
                <span class="result-spacer"></span>
                <button id="result-copy" class="result-btn" type="button" title="Copy">Copy</button>
                <button id="result-close" class="result-btn result-close" type="button" title="Close (Esc)">✕</button>
              </div>
              <div id="result-body" class="result-body">
                <div id="result-text" class="result-text"></div>
                <div id="result-notes" class="result-notes"></div>
              </div>
              <div class="result-actions">
                <button id="result-replace" class="chip chip-primary" type="button" hidden>Replace</button>
                <div id="refine-chips" class="refine-chips"></div>
              </div>
              <div id="result-footer" class="result-footer"></div>
            </div>

            <!-- P0 #3: Stop button (shown when bot is working) -->
            <div id="stop-area" class="stop-area" hidden>
              <button id="stop-btn" class="chip chip-primary stop-btn" type="button" title="Stop the bot's reply">Stop</button>
              <span id="stop-elapsed" class="stop-elapsed"></span>
            </div>
          </div>

          <!-- P0 #1: Transcript view panel -->
          <div id="view-transcript-panel" class="view-panel view-transcript hidden">
            <div id="transcript-container" class="transcript-container"></div>
            <div id="transcript-footer" class="transcript-footer">
              <button id="transcript-copy" class="chip chip-quiet" type="button">Copy All</button>
            </div>
          </div>

          <!-- Bottom row: < (prev bot) | tap-to-type | > (next bot) -->
          <div class="bottom-nav-row">
            <button id="prev-bot-btn" class="nav-chevron-btn" type="button" aria-label="Previous bot" title="Previous bot (←)">
              <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.25 3.5 5.75 8l4.5 4.5" />
              </svg>
            </button>

            <!-- Center: tap-to-type target OR left-aligned inline text input -->
            <div class="center-wave-slot">
              <button
                id="tap-to-type-btn"
                class="tap-to-type-btn"
                type="button"
                title="Tap to type a message"
              >
                <div id="idle-dots" class="idle-dots">
                  <span></span><span></span><span></span>
                </div>
              </button>

              <form id="type-form" class="type-form" autocomplete="off" hidden>
                <input
                  id="type-input"
                  class="type-input"
                  type="text"
                  placeholder="Message MausBot…"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="off"
                  spellcheck="false"
                />
              </form>
            </div>

            <button id="next-bot-btn" class="nav-chevron-btn" type="button" aria-label="Next bot" title="Next bot (→)">
              <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5.75 3.5 10.25 8l-4.5 4.5" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
