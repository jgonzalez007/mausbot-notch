name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check local bridge
        run: for f in server.mjs settings.mjs public/app.js public/settings.js; do node --input-type=module --check < "$f"; done

      - name: Build app (native arch)
        run: bash scripts/build-mac-app.sh

      - name: Verify signature
        run: codesign --verify --deep --strict "MausBot Notch.app"

      - name: Smoke test
        run: bash scripts/smoke-test.sh

      - name: Bridge tests
        run: node scripts/bridge-test.mjs

      - name: Screen tests (presses every button)
        run: node scripts/ui-test.mjs

      - name: Draft destination and shortcut tests
        run: bash scripts/swift-test.sh
